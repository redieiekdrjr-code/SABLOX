name: Build SABLOX Android APK
# Rebuild after fixing arena and service-worker syntax.

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          SABLOX_SERVER_URL: ${{ vars.SABLOX_SERVER_URL || 'https://sablox.bonto.run' }}
        run: gradle --no-daemon :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: SABLOX-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
