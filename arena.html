<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><link rel="manifest" href="/manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827"><title>SABLOX Arena</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#f7f9ff;font-family:system-ui,Arial,sans-serif;touch-action:none}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#273b5c,#101827 65%)}
header{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ffffff18;background:#111a2a}
.brand{font-weight:1000;letter-spacing:1px}.brand b{color:#76d6ff}.sub{font-size:12px;color:#9fb1c9}
#hud{display:flex;gap:14px;align-items:center;font-weight:800;font-size:13px}.pill{padding:7px 11px;border-radius:9px;background:#ffffff12;border:1px solid #ffffff16}
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:10px}
canvas{display:block;width:min(100%,1100px);height:auto;max-height:100%;aspect-ratio:16/9;border-radius:14px;border:1px solid #ffffff25;box-shadow:0 20px 70px #0008;background:#1c3440;object-fit:contain}
#overlay{position:absolute;inset:0;display:block;background:linear-gradient(135deg,#09a9ec,#16d8ec 52%,#0785d5);border-radius:14px;z-index:3;overflow:hidden;color:#fff}
.lobby{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 53%,#9dfaff 0,#36d8f1 34%,#08a4e9 75%,#0878cb 100%);font-weight:900;text-shadow:0 2px 2px #071d3d88}
.lobby:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,#ffffff08 0 2px,transparent 2px 9px);pointer-events:none}
.top-left,.top-right{position:absolute;top:1.5%;display:flex;gap:8px;align-items:stretch}.top-left{left:1.5%}.top-right{right:1.5%}
.profile,.trophybar,.currency,.menu-btn,.side-btn,.pass-card,.mode-card,.play-btn,.fighter-tag{border:3px solid #101b35;border-radius:8px;box-shadow:0 4px 0 #07152a88,0 7px 12px #001a3b55;background:linear-gradient(#344d78,#1c2e50);color:white}
.profile{width:104px;display:grid;place-items:center;font-size:12px;padding:5px}.profile .face{font-size:31px;background:#55c7ef;border:3px solid #111c36;border-radius:8px;padding:3px 13px}
.trophybar{width:210px;display:flex;align-items:center;justify-content:space-around;padding:7px;background:linear-gradient(#35476c,#192b4c);font-size:19px;color:#ffd54b}.trophybar small{font-size:10px;color:#dbe9ff}
.top-right{align-items:center}.currency{padding:8px 11px;min-width:75px;text-align:center;font-size:14px}.currency.gold{color:#ffdf4c}.currency.gem{color:#80ff8d}.menu-btn{font-size:23px;padding:5px 14px}
.side-stack{position:absolute;top:35%;display:grid;gap:9px;width:100px}.side-stack.left{left:1.5%}.side-stack.right{right:1.5%}
.side-btn{height:51px;padding:5px 4px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:5px;background:linear-gradient(#405b87,#1b2e50);cursor:pointer}
.side-btn span{font-size:21px}.side-btn:active,.menu-btn:active{transform:translateY(2px)}
.fighter-area{position:absolute;left:50%;top:16%;transform:translateX(-50%);width:34%;height:61%;display:grid;place-items:center}
.fighter-tag{position:absolute;top:0;display:flex;align-items:center;gap:8px;padding:5px 12px;color:#ffdc52;font-size:14px}
.mascot{position:relative;width:150px;height:255px;filter:drop-shadow(0 9px 3px #00395a66);transform:scale(var(--fighter-scale,1))}
.mascot .hair{position:absolute;left:33px;top:8px;width:90px;height:86px;border-radius:48% 48% 38% 38%;background:radial-gradient(circle at 35% 20%,#e7a4ff,#8a35d7 68%,#5022a0);z-index:3}
.mascot .hair:before,.mascot .hair:after{content:"";position:absolute;background:#a64ce8;border-radius:50%;width:52px;height:55px;top:29px}.mascot .hair:before{left:-20px}.mascot .hair:after{right:-19px}
.mascot .head{position:absolute;left:49px;top:55px;width:61px;height:69px;border-radius:43% 43% 48% 48%;background:linear-gradient(120deg,#f6b37c,#b96945);z-index:4}
.mascot .brow{position:absolute;top:20px;left:8px;width:18px;height:5px;background:#55284d;border-radius:5px;transform:rotate(-8deg)}.mascot .brow.r{left:36px;transform:rotate(8deg)}
.mascot .eye{position:absolute;top:29px;left:13px;width:9px;height:13px;border-radius:50%;background:#fff}.mascot .eye.r{left:39px}.mascot .pupil{position:absolute;inset:3px 2px 2px;background:#25354b;border-radius:50%}
.mascot .body{position:absolute;left:38px;top:119px;width:78px;height:83px;background:linear-gradient(90deg,#7b55d8,#b28aff);border-radius:24px 24px 14px 14px;z-index:2}
.mascot .scarf{position:absolute;left:30px;top:126px;width:91px;height:48px;background:linear-gradient(120deg,#ffe45b,#ff9d23);clip-path:polygon(0 0,100% 0,75% 100%,34% 75%);z-index:5}
.mascot .leg{position:absolute;top:188px;width:31px;height:66px;background:linear-gradient(90deg,#344b9a,#1b2862);border-radius:9px 9px 5px 5px;z-index:1}.mascot .leg.l{left:43px;transform:rotate(5deg)}.mascot .leg.r{left:82px;transform:rotate(-4deg)}
.mascot .boot{position:absolute;top:239px;width:44px;height:15px;background:#182552;border-radius:10px;z-index:2}.mascot .boot.l{left:32px}.mascot .boot.r{left:78px}
.mascot .blaster{position:absolute;left:4px;top:46px;width:29px;height:99px;border-radius:8px;background:linear-gradient(90deg,#5b493f,#c8793b,#382b39);border:5px solid #29324b;transform:rotate(-9deg);z-index:2}
.change-fighter{position:absolute;left:calc(50% + 125px);top:46%;background:#ffffff3b;border:2px solid #ffffffa0;border-radius:10px;color:white;font-size:24px;width:46px;height:46px;padding:0}
.pass-card{position:absolute;left:1.5%;bottom:2%;width:27%;height:19%;padding:8px;background:linear-gradient(#ffd93e,#f7a900);color:#fff;text-shadow:0 2px #754500}
.pass-title{font-size:17px;color:#fff}.progress{height:16px;background:#25334b;border:2px solid #121e34;border-radius:20px;margin-top:9px;overflow:hidden}.progress i{display:block;width:34%;height:100%;background:linear-gradient(#fff26a,#ff9d25)}
.mode-card{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);width:35%;height:19%;padding:10px 12px;display:flex;align-items:center;gap:12px;background:linear-gradient(#263c63,#142441);cursor:pointer}
.mode-icon{font-size:30px;background:#fff;color:#263c63;border-radius:50%;padding:7px}.mode-name{font-size:16px}.mode-desc{font-size:11px;color:#8df45e}
.play-btn{position:absolute;right:1.5%;bottom:2%;width:24%;height:19%;font-size:clamp(20px,3vw,36px);background:linear-gradient(#ffe94a,#ffb900);color:#fff;text-shadow:0 3px #9c5700;border:4px solid #15203a;cursor:pointer}
.hidden-selects{display:none}
.lobby-toast{position:absolute;left:50%;top:13%;transform:translateX(-50%);padding:8px 14px;background:#172c4cdd;border:2px solid #ffffff55;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.lobby-toast.show{opacity:1}
button{border:0;cursor:pointer;font-weight:900}
@media(max-height:430px){.side-stack{top:29%;gap:5px;width:85px}.side-btn{height:39px;font-size:10px}.fighter-area{top:14%;height:65%}.mascot{transform:scale(.78)}.pass-card,.mode-card,.play-btn{height:17%;bottom:1.5%}.pass-title{font-size:13px}.top-left,.top-right{gap:4px}.profile{width:78px}.trophybar{width:150px}.currency{padding:5px;min-width:55px}.change-fighter{left:calc(50% + 105px)}}
@media(max-width:650px){.side-stack{width:75px}.side-btn{font-size:9px;height:43px}.side-btn span{font-size:17px}.profile{width:65px;font-size:9px}.profile .face{font-size:22px}.trophybar{width:120px;font-size:14px}.currency{min-width:42px;padding:5px;font-size:11px}.top-right{gap:3px}.fighter-area{width:40%}.mascot{transform:scale(.75)}.pass-card{width:29%}.mode-card{width:37%;gap:5px;padding:5px}.mode-name{font-size:11px}.mode-desc{font-size:9px}.play-btn{width:23%}.change-fighter{left:calc(50% + 95px);width:36px;height:36px}}

#controls{height:112px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 900px)/2));gap:20px}
.hint{font-size:12px;color:#9fb1c9;text-align:center;flex:1}
#stick{width:88px;height:88px;border-radius:50%;background:#ffffff13;border:2px solid #ffffff35;position:relative;flex:none}
#nub{width:36px;height:36px;border-radius:50%;background:#9ddfff;box-shadow:0 3px 12px #0007;position:absolute;left:24px;top:24px}
#fire,#dash,#super{width:88px;height:88px;border-radius:50%;border:4px solid #ffffff65;box-shadow:0 5px 20px #0007;flex:none}#dash.cooldown,#super.cooldown{filter:grayscale(.8);opacity:.68}#fire{background:radial-gradient(circle at 35% 30%,#ffbd74,#f05d62);color:#32100d}#dash{background:radial-gradient(circle at 35% 30%,#b9a2ff,#7554d8);color:#160d36;font-size:12px}#super{background:radial-gradient(circle at 35% 30%,#ffe58b,#e59b32);color:#392000;font-size:12px}#super.cooldown{filter:grayscale(.8);opacity:.55}
@media(hover:hover) and (pointer:fine){#controls{height:54px}.hint{font-size:13px}#stick,#fire,#dash,#super{display:none}}
@media(orientation:landscape) and (max-height:520px){header{height:42px;padding:0 12px}#stage{padding:4px}canvas{width:auto;height:100%;max-width:100%;max-height:100%;aspect-ratio:16/9}#controls{height:82px;padding:0 16px;gap:12px}#stick,#fire,#dash,#super{width:68px;height:68px}#nub{left:15px;top:15px}#overlay{inset:4px}.panel{padding:12px 20px;width:min(440px,80%)}.panel h1{font-size:30px}.panel p{margin:5px 0}.panel select{padding:7px;margin-bottom:6px}button{padding:9px 14px}}@media(max-width:560px){header{height:50px;padding:0 10px}#hud{gap:5px;font-size:11px}.pill{padding:6px 7px}#stage{padding:5px}#overlay{inset:5px}#controls{height:106px;padding:0 18px}.hint{font-size:10px}}
</style>
</head>
<body><div id="app">
<header><div><div class="brand">SABLOX <b>ARENA</b></div><div class="sub" id="netstatus">2D • арена SABLOX</div></div><div id="hud"><span class="pill">❤ <span id="hp">100</span></span><span class="pill">★ <span id="score">0</span>/10</span><span class="pill">☠ <span id="enemies">3</span></span><span class="pill">⏱ <span id="time">02:00</span></span></div></header>
<main id="stage"><canvas id="game" width="960" height="540" aria-label="Игровая арена"></canvas>
<div id="overlay"><div class="lobby">
<div class="top-left"><button class="profile lobby-action" data-label="Профиль"><div class="face">☠</div><small>SABLOX ID</small></button><div class="trophybar">🏆 <span id="trophyCount">45</span><small>ПРОГРЕСС</small></div></div>
<div class="top-right"><div class="currency gold">🪙 168</div><div class="currency gem">💎 0</div><div class="currency">🟢 0</div><button class="menu-btn lobby-action" data-label="Настройки">☰</button></div>
<div class="side-stack left"><button class="side-btn lobby-action" data-label="События"><span>🎟️</span> СОБЫТИЯ</button><button class="side-btn lobby-action" data-label="Награды"><span>🎁</span> НАГРАДЫ</button><button class="side-btn lobby-action" data-label="Задания"><span>📋</span> ЗАДАНИЯ</button></div>
<div class="side-stack right"><button class="side-btn lobby-action" data-label="Магазин"><span>🛒</span> МАГАЗИН</button><button class="side-btn lobby-action" data-label="Клуб"><span>🛡️</span> КЛУБ</button><button class="side-btn lobby-action" data-label="Чат"><span>💬</span> ЧАТ</button></div>
<div class="fighter-area"><div class="fighter-tag">📦 <span id="fighterTrophies">45</span> 🏅 2</div><div class="mascot"><div class="blaster"></div><div class="hair"></div><div class="head"><i class="brow"></i><i class="brow r"></i><i class="eye"><i class="pupil"></i></i><i class="eye r"><i class="pupil"></i></i></div><div class="body"></div><div class="scarf"></div><div class="leg l"></div><div class="leg r"></div><div class="boot l"></div><div class="boot r"></div></div></div>
<button class="change-fighter" id="changeFighter" aria-label="Сменить бойца">＋</button>
<div class="pass-card"><div class="pass-title">🎫 SABLOX PASS</div><div class="progress"><i></i></div><small>УРОВЕНЬ 3 · 34 / 100</small></div>
<div class="mode-card" id="modeCard"><div class="mode-icon">☠</div><div><div class="mode-name" id="modeName">SOLO SHOWDOWN</div><div class="mode-desc" id="modeDesc">Выживи и победи!</div></div></div>
<button class="play-btn" id="start">ИГРАТЬ</button>
<div class="lobby-toast" id="lobbyToast"></div>
<div class="hidden-selects"><select id="heroSelect"><option value="ranger">Рейнджер</option><option value="vanguard">Танк</option><option value="runner">Скаут</option></select><select id="modeSelect"><option value="showdown">Выживание</option><option value="training">Тренировка</option></select><select id="mapSelect"><option value="grove">Роща</option><option value="foundry">Фабрика</option><option value="ruins">Руины</option></select><div id="message">Выбери бойца</div></div>
</div></div></main>
<footer id="controls"><div id="stick"><div id="nub"></div></div><div class="hint">На ПК: WASD — движение · мышь — прицел · Space — атака · Shift — рывок · E — супер</div><button id="super">СУПЕР</button><button id="dash">РЫВОК</button><button id="fire">АТАКА</button></footer>
</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=960,H=540;
const $=id=>document.getElementById(id);
let running=false,last=0,elapsed=0,score=0,player,foes=[],shots=[],particles=[],keys={},aim={x:700,y:270},mouseDown=false,fireHeld=false,joystick={x:0,y:0},spawnClock=0,dashQueued=false,superCharge=0,superQueued=false,activeMap="grove";
let socket=null,myId=null,remotePlayers=new Map(),lastNet=0,netReady=false;
let walls=[];const maps={grove:[{x:270,y:100,w:105,h:58},{x:580,y:100,w:105,h:58},{x:270,y:382,w:105,h:58},{x:580,y:382,w:105,h:58},{x:440,y:205,w:80,h:130}],foundry:[{x:130,y:110,w:180,h:48},{x:650,y:110,w:180,h:48},{x:130,y:382,w:180,h:48},{x:650,y:382,w:180,h:48},{x:420,y:70,w:120,h:90},{x:420,y:380,w:120,h:90}],ruins:[{x:210,y:90,w:80,h:110},{x:670,y:90,w:80,h:110},{x:210,y:340,w:80,h:110},{x:670,y:340,w:80,h:110},{x:410,y:215,w:140,h:70},{x:80,y:245,w:90,h:45},{x:790,y:245,w:90,h:45}]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const heroes={ranger:{speed:220,damage:22,fireRate:.24,bulletSpeed:470},vanguard:{speed:185,damage:32,fireRate:.42,bulletSpeed:420},runner:{speed:275,damage:14,fireRate:.16,bulletSpeed:500}};
function circleRect(x,y,r,b){let px=clamp(x,b.x,b.x+b.w),py=clamp(y,b.y,b.y+b.h);return (x-px)**2+(y-py)**2<r*r}
function blocked(x,y,r){return x<r+18||x>W-r-18||y<r+18||y>H-r-18||walls.some(b=>circleRect(x,y,r,b))}
function move(o,dx,dy){let nx=o.x+dx,ny=o.y;if(!blocked(nx,ny,o.r))o.x=nx;ny=o.y+dy;if(!blocked(o.x,ny,o.r))o.y=ny}
function reset(){elapsed=0;score=0;superCharge=0;superQueued=false;activeMap=$('mapSelect').value||"grove";walls=maps[activeMap]||maps.grove;shots=[];particles=[];const hero=heroes[$('heroSelect').value]||heroes.ranger;player={x:150,y:270,r:19,hp:100,cd:0,inv:0,abilityCd:0,angle:0,heroId:$('heroSelect').value,...hero};foes=[];for(let i=0;i<3;i++)spawnFoe();hud()}
function spawnFoe(){let p;const roll=Math.random(),kind=roll<.28?'tank':roll<.62?'scout':'raider';const stats=kind==='tank'?{r:22,hp:96,speed:48,damage:18}:kind==='scout'?{r:15,hp:42,speed:128,damage:8}:{r:18,hp:62,speed:78,damage:12};for(let tries=0;tries<50;tries++){p={x:650+Math.random()*240,y:65+Math.random()*410,...stats,maxHp:stats.hp,kind,cd:.5+Math.random(),angle:0};if(!blocked(p.x,p.y,p.r)&&dist(p,player)>260)break}foes.push(p)}
function hud(){$('super').textContent=superCharge>=100?"СУПЕР!":("СУПЕР "+Math.floor(superCharge)+"%");$('super').classList.toggle("cooldown",superCharge<100);$('hp').textContent=Math.max(0,Math.ceil(player?.hp||0));$('score').textContent=score;$('enemies').textContent=foes.length;$('time').textContent=$('modeSelect').value==='training'?'∞':fmt(Math.max(0,120-elapsed));const cooling=(player?.abilityCd||0)>0;$('dash').textContent=cooling?player.abilityCd.toFixed(1)+'с':'РЫВОК';$('dash').classList.toggle('cooldown',cooling)}
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function shoot(owner,x,y,angle){let speed=owner===player?owner.bulletSpeed:310;shots.push({x:x+Math.cos(angle)*24,y:y+Math.sin(angle)*24,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,owner,life:1.45,damage:owner.damage||12,color:owner===player?(owner.heroId==='vanguard'?'#ffc27a':owner.heroId==='runner'?'#a8ff9d':'#b6f1ff'):'#ff9d83',r:6})}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=35+Math.random()*145;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.45,color})}}
function update(dt){elapsed+=dt;player.cd-=dt;player.inv-=dt;let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joystick.x,my=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joystick.y;let m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}move(player,mx*player.speed*dt,my*player.speed*dt);if(matchMedia('(pointer:coarse)').matches&&foes.length){let target=foes.reduce((best,f)=>dist(player,f)<dist(player,best)?f:best,foes[0]);aim.x=target.x;aim.y=target.y}player.angle=Math.atan2(aim.y-player.y,aim.x-player.x);
if(superQueued&&superCharge>=100){superQueued=false;superCharge=0;burst(player.x,player.y,"#ffe58b",42);for(const f of [...foes])if(dist(player,f)<175){f.hp-=player.heroId==="vanguard"?115:85;burst(f.x,f.y,"#ffe58b",16);if(f.hp<=0){score++;foes.splice(foes.indexOf(f),1);spawnClock=0}}}superQueued=false;if(dashQueued&&player.abilityCd<=0){let dx=mx,dy=my;if(Math.hypot(dx,dy)<.1){dx=Math.cos(player.angle);dy=Math.sin(player.angle)}let length=Math.hypot(dx,dy)||1;dx/=length;dy/=length;const dashSteps=player.heroId==='runner'?13:player.heroId==='vanguard'?7:9;for(let i=0;i<dashSteps;i++)move(player,dx*13,dy*13);player.inv=player.heroId==='runner'?.55:.42;player.abilityCd=player.heroId==='runner'?7:6;burst(player.x,player.y,'#b9a2ff',18);if(player.heroId==='vanguard'){for(const f of [...foes])if(dist(player,f)<88){f.hp-=24;burst(f.x,f.y,'#ffc27a',10);if(f.hp<=0){score++;foes.splice(foes.indexOf(f),1);burst(f.x,f.y,'#ffdb86',18)}}}}dashQueued=false;player.abilityCd=Math.max(0,player.abilityCd-dt);if((mouseDown||keys.Space||fireHeld)&&player.cd<=0){shoot(player,player.x,player.y,player.angle);player.cd=player.fireRate}
for(let f of foes){f.cd-=dt;let d=dist(f,player),a=Math.atan2(player.y-f.y,player.x-f.x);f.angle=a;let speed=f.kind==='tank'?(d>72?1:0):f.kind==='scout'?(d>190?1:d<110?-.8:0):(d>240?1:d<145?-.65:0);move(f,Math.cos(a)*speed*dt,Math.sin(a)*speed*dt);if(f.cd<=0&&d<520){const spread=f.kind==='scout'?.24:.13;shoot(f,f.x,f.y,a+(Math.random()-.5)*spread);f.cd=(f.kind==='tank'?1.2:.85)+Math.random()*.45}}

function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}

function drawFighter(o,main,dark){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);ctx.fillStyle='#07121b66';ctx.beginPath();ctx.ellipse(0,13,21,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=dark;ctx.fillRect(0,-7,31,14);ctx.fillStyle=main;ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5fbff';ctx.beginPath();ctx.arc(6,-6,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#14202a';ctx.beginPath();ctx.arc(8,-6,2,0,Math.PI*2);ctx.fill();ctx.restore();
